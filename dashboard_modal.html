<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF Watcher — Painel de Análise Estrutural</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --wf-verde-escuro: #1F4E3D;
            --wf-verde-medio: #2E7D5B;
            --wf-verde-claro: #3E9970;
            --wf-grafite: #1A1F24;
            --wf-cinza-texto: #4A5257;
            --wf-cinza-borda: #D6DBD8;
            --bg-app: #F4F6F5;
            --bg-card: #FFFFFF;
            --text-dark: #1A1F24;
            --text-muted: #6B7280;
            --radius-lg: 16px;
            --radius-sm: 8px;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at 15% 0%, rgba(46, 125, 91, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 85% 100%, rgba(31, 78, 61, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--wf-cinza-borda);
            padding: 0 32px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand { display: flex; align-items: center; gap: 16px; }
        .brand-logo { height: 40px; width: auto; object-fit: contain; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-title { font-size: 1.1rem; font-weight: 700; color: var(--wf-verde-escuro); letter-spacing: -0.5px; }
        .brand-subtitle { font-size: 0.75rem; color: var(--wf-cinza-texto); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        .header-status {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600;
            color: var(--wf-verde-medio); background: rgba(46, 125, 91, 0.1);
            padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(46, 125, 91, 0.2);
        }

        .nav-tabs { display: flex; gap: 4px; padding: 8px 32px 0 32px; border-bottom: 1px solid var(--wf-cinza-borda); }
        .nav-tab {
            background: transparent; border: none; padding: 12px 24px;
            font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600;
            color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-tab.active { color: var(--wf-verde-escuro); border-bottom-color: var(--wf-verde-escuro); }

        .page-content { flex: 1; padding: 32px; max-width: 1800px; margin: 0 auto; width: 100%; display: block; }

        .grid-layout {
            display: grid; grid-template-columns: 2.2fr 1fr; gap: 24px; margin-bottom: 24px;
        }
        @media (max-width: 1200px) { .grid-layout { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-card); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); border: 1px solid var(--wf-cinza-borda);
            overflow: hidden; display: flex; flex-direction: column;
        }
        .card-header {
            padding: 20px 24px; border-bottom: 1px solid var(--wf-cinza-borda);
            background: linear-gradient(to right, rgba(244, 246, 245, 0.5), transparent);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--wf-verde-escuro); display: flex; gap: 10px; }
        .card-body { padding: 24px; flex: 1; }

        .table-responsive { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th {
            background-color: var(--bg-app); color: var(--wf-cinza-texto); font-weight: 600;
            text-align: left; padding: 14px 16px; border-bottom: 2px solid var(--wf-cinza-borda);
        }
        tr.linha-principal { cursor: pointer; border-bottom: 1px solid var(--wf-cinza-borda); }
        tr.linha-principal:hover { background-color: rgba(46, 125, 91, 0.03); }
        td { padding: 14px 16px; vertical-align: middle; }
        tr.linha-detalhe { background-color: rgba(244, 246, 245, 0.6); border-bottom: 1px solid var(--wf-cinza-borda); }
        tr.linha-detalhe td { padding: 0; }

        .detalhe-container {
            padding: 20px 24px; display: none; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        .detalhe-container.show { display: grid; }

        .detalhe-bloco { display: flex; flex-direction: column; gap: 8px; }
        .detalhe-titulo {
            font-size: 0.8rem; font-weight: 700; color: var(--wf-verde-escuro);
            text-transform: uppercase; border-bottom: 1px solid var(--wf-cinza-borda);
            padding-bottom: 4px; margin-bottom: 4px;
        }
        .detalhe-item { font-size: 0.85rem; display: flex; justify-content: space-between; padding: 4px 0; }
        .detalhe-item span:first-child { color: var(--text-muted); }
        .detalhe-item span:last-child { font-family: 'JetBrains Mono', monospace; font-weight: 600; }

        .descricao-completa {
            grid-column: 1 / -1; background: var(--bg-card); padding: 12px 16px;
            border-left: 3px solid var(--wf-verde-medio); border-radius: 4px;
            font-size: 0.95rem; font-weight: 500;
        }

        .mode-badge {
            display: inline-flex; align-items: center; padding: 4px 10px;
            border-radius: 12px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .badge-flexao { background: rgba(46, 125, 91, 0.1); color: var(--wf-verde-medio); }
        .badge-torcao { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .badge-local  { background: rgba(107, 114, 128, 0.1); color: #6B7280; }

        .freq-cell { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--wf-verde-escuro); }
        .chevron { transition: transform 0.3s ease; display: inline-block; }
        .chevron.open { transform: rotate(90deg); }

        .main-video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius-sm); overflow: hidden; }
        .main-video video { width: 100%; height: 100%; object-fit: contain; }
        
        .video-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-top: 16px; }
        .video-thumb {
            min-width: 110px; padding: 10px; background: var(--bg-app); border: 1px solid var(--wf-cinza-borda);
            border-radius: var(--radius-sm); cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .video-thumb:hover, .video-thumb.active { border-color: var(--wf-verde-medio); background: rgba(46, 125, 91, 0.05); }
        .video-thumb.active { box-shadow: 0 0 0 2px var(--wf-verde-medio); }
        .thumb-freq { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 700; color: var(--wf-verde-escuro); }
        .thumb-mode { font-size: 0.75rem; color: var(--text-muted); }

        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        @media (max-width: 1000px) { .charts-grid { grid-template-columns: 1fr; } }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <img src="logo_wf.png" alt="WF Logo" class="brand-logo" onerror="this.style.display='none';">
            <div class="brand-text">
                <span class="brand-title">WF Watcher</span>
                <span class="brand-subtitle">Painel de Análise Estrutural</span>
            </div>
        </div>
        <div class="header-status">
            <div class="pulse-dot" style="width: 8px; height: 8px; background-color: var(--wf-verde-medio); border-radius: 50%;"></div>
            <span id="statusText">Dados Embutidos</span>
        </div>
    </header>

    <nav class="nav-tabs">
        <button class="nav-tab active">
            <span>📊</span> Análise Modal
        </button>
    </nav>

    <main class="page-content">
        
        <div class="charts-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📈 Curva de Frequências Naturais</div>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="chartFreq"></canvas>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📊 Massas Efetivas por Modo (%)</div>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="chartMassa"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📋 Tabela Detalhada de Modos de Vibração</div>
                    <span style="font-size: 0.8rem; color: var(--text-muted);">Clique na linha para expandir</span>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="table-responsive">
                        <table id="tabelaModos">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"></th>
                                    <th>Modo</th>
                                    <th>Freq (Hz)</th>
                                    <th>Tipo / Direção</th>
                                    <th>Confiança</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Preenchido via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title">🎥 Animação dos Modos</div>
                </div>
                <div class="card-body">
                    <div class="main-video">
                        <video id="videoPlayer" controls>
                            <source src="" type="video/mp4">
                            Seu navegador não suporta vídeos.
                        </video>
                    </div>
                    <div class="video-list" id="videoList"></div>
                </div>
            </div>
        </div>
    </main>

        let chartFreqInstance = null;
        let chartMassaInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (DADOS_EMBUTIDOS && DADOS_EMBUTIDOS.length > 0) {
                document.getElementById('statusText').innerText = "Dados Embutidos Carregados";
                renderizarTabela(DADOS_EMBUTIDOS);
                renderizarGraficos(DADOS_EMBUTIDOS);
                renderizarVideos(VIDEOS_BASE64, DADOS_EMBUTIDOS);
            } else {
                document.getElementById('statusText').innerText = "Nenhum dado encontrado";
            }
        });

        function toggleDetalhe(numModo) {
            const container = document.getElementById(`container-${numModo}`);
            const chevron = document.getElementById(`chev-${numModo}`);
            container.classList.toggle('show');
            chevron.classList.toggle('open');
        }

        function renderizarTabela(dados) {
            const tbody = document.querySelector('#tabelaModos tbody');
            tbody.innerHTML = '';

            dados.forEach(modo => {
                let badgeClass = 'badge-local';
                if (modo.tipoModo === 'flexão') badgeClass = 'badge-flexao';
                else if (modo.tipoModo === 'torção') badgeClass = 'badge-torcao';

                let fatoresHtml = '<div style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;">';
                const matches = modo.fatores.match(/(Γ\w+=[-0-9.,]+)/g);
                if (matches) {
                    matches.forEach(m => {
                        const parts = m.split('=');
                        fatoresHtml += `<div class="detalhe-item"><span>${parts[0]}</span><span>${parts[1]}</span></div>`;
                    });
                }
                fatoresHtml += '</div>';

                const trMain = document.createElement('tr');
                trMain.className = 'linha-principal';
                trMain.onclick = () => toggleDetalhe(modo.numero);
                trMain.innerHTML = `
                    <td style="text-align: center; color: var(--wf-verde-medio);"><span class="chevron" id="chev-${modo.numero}">▶</span></td>
                    <td style="font-weight: 700; color: var(--wf-verde-escuro);">${String(modo.numero).padStart(2, '0')}</td>
                    <td class="freq-cell">${modo.freq.toFixed(4)}</td>
                    <td><span class="mode-badge ${badgeClass}">${modo.tipoModo} (${modo.dirDominante})</span></td>
                    <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;">${modo.confianca.toFixed(1)}%</td>
                `;
                tbody.appendChild(trMain);

                const trDetail = document.createElement('tr');
                trDetail.className = 'linha-detalhe';
                trDetail.innerHTML = `
                    <td colspan="5">
                        <div class="detalhe-container" id="container-${modo.numero}">
                            <div class="descricao-completa"><strong>Descrição:</strong> ${modo.descricaoCompleta}</div>
                            <div class="detalhe-bloco">
                                <div class="detalhe-titulo">Propriedades</div>
                                <div class="detalhe-item"><span>Período</span><span>${modo.periodo.toFixed(6)} s</span></div>
                                <div class="detalhe-item"><span>Freq. Angular (ω)</span><span>${modo.omega.toFixed(4)} rad/s</span></div>
                            </div>
                            <div class="detalhe-bloco">
                                <div class="detalhe-titulo">Massa Efetiva (%)</div>
                                <div class="detalhe-item"><span>Translação X</span><span>${modo.massas[0].toFixed(3)} %</span></div>
                                <div class="detalhe-item"><span>Translação Y</span><span>${modo.massas[1].toFixed(3)} %</span></div>
                                <div class="detalhe-item"><span>Translação Z</span><span>${modo.massas[2].toFixed(3)} %</span></div>
                                <div class="detalhe-item"><span>Rotação RX</span><span>${modo.massas[3].toFixed(3)} %</span></div>
                                <div class="detalhe-item"><span>Rotação RY</span><span>${modo.massas[4].toFixed(3)} %</span></div>
                                <div class="detalhe-item"><span>Rotação RZ</span><span>${modo.massas[5].toFixed(3)} %</span></div>
                            </div>
                            <div class="detalhe-bloco" style="grid-column: 1 / -1;">
                                <div class="detalhe-titulo">Fatores de Participação (Γ)</div>
                                ${fatoresHtml}
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(trDetail);
            });
        }

        function renderizarGraficos(dados) {
            const labels = dados.map(m => `M${m.numero}`);
            
            const ctxFreq = document.getElementById('chartFreq').getContext('2d');
            if (chartFreqInstance) chartFreqInstance.destroy();
            chartFreqInstance = new Chart(ctxFreq, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Frequência Natural (Hz)',
                        data: dados.map(m => m.freq),
                        borderColor: '#1F4E3D', backgroundColor: 'rgba(31, 78, 61, 0.1)',
                        borderWidth: 2, pointBackgroundColor: '#2E7D5B', pointRadius: 4, fill: true, tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const ctxMassa = document.getElementById('chartMassa').getContext('2d');
            if (chartMassaInstance) chartMassaInstance.destroy();
            chartMassaInstance = new Chart(ctxMassa, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Translação (X+Y+Z)', data: dados.map(m => m.massas[0] + m.massas[1] + m.massas[2]), backgroundColor: '#2E7D5B', borderRadius: 4 },
                        { label: 'Rotação (RX+RY+RZ)', data: dados.map(m => m.massas[3] + m.massas[4] + m.massas[5]), backgroundColor: '#8B5CF6', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: true }, y: { stacked: true } } }
            });
        }

        function renderizarVideos(videosB64, dados) {
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = '';

            Object.keys(videosB64).forEach(numModo => {
                const modoInfo = dados.find(m => m.numero == numModo);
                if (!modoInfo) return;

                const thumb = document.createElement('div');
                thumb.className = 'video-thumb';
                thumb.onclick = () => tocarVideo(videosB64[numModo], thumb);
                thumb.innerHTML = `
                    <div class="thumb-freq">${modoInfo.freq.toFixed(2)} Hz</div>
                    <div class="thumb-mode">Modo ${numModo}</div>
                `;
                videoList.appendChild(thumb);
            });

            if (Object.keys(videosB64).length > 0) {
                const primeiro = videoList.firstChild;
                if (primeiro) primeiro.click();
            }
        }

        function tocarVideo(base64, thumbElement) {
            const player = document.getElementById('videoPlayer');
            const source = player.querySelector('source');
            source.src = base64;
            player.load();
            player.play().catch(e => console.log("Autoplay bloqueado."));

            document.querySelectorAll('.video-thumb').forEach(el => el.classList.remove('active'));
            if (thumbElement) thumbElement.classList.add('active');
        }
    </script>
</body>
</html>
